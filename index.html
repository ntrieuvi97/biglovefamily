<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguyễn Triệu Vĩ & Phan Trần Thị Thanh Thương - Lựa chọn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Playfair Display', serif;
            background: linear-gradient(135deg, #f8f6f0 0%, #ede9e0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 40px 20px;
            text-align: center;
        }

        .header {
            margin-bottom: 80px;
            animation: fadeIn 1s ease-in;
        }

        .main-title {
            font-family: 'Great Vibes', cursive;
            font-size: 64px;
            color: #8b6f47;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            font-size: 22px;
            color: #666;
            font-weight: 300;
            font-style: italic;
            margin-bottom: 30px;
        }

        .divider {
            width: 100px;
            height: 2px;
            background: linear-gradient(to right, transparent, #d4af37, transparent);
            margin: 0 auto 40px;
        }

        .choices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 50px;
            margin-top: 60px;
            perspective: 1000px;
        }

        .choice-card {
            position: relative;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            animation: slideIn 0.8s ease-out;
        }

        .choice-card:nth-child(1) {
            animation-delay: 0.2s;
        }

        .choice-card:nth-child(2) {
            animation-delay: 0.4s;
        }

        .choice-card:hover {
            transform: translateY(-20px);
        }

        .card-frame {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .choice-card:hover .card-frame {
            box-shadow: 0 30px 80px rgba(212, 175, 55, 0.3);
            border: 2px solid #d4af37;
        }

        /* Decorative elements */
        .card-frame::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            border-top: 2px solid #d4af37;
            border-left: 2px solid #d4af37;
        }

        .card-frame::after {
            content: '';
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-bottom: 2px solid #d4af37;
            border-right: 2px solid #d4af37;
        }

        .choice-icon {
            font-size: 80px;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            display: block;
        }

        .choice-card:hover .choice-icon {
            transform: scale(1.08);
            box-shadow: 0 10px 40px rgba(212, 175, 55, 0.3);
        }

        .choice-name {
            font-family: 'Great Vibes', cursive;
            font-size: 52px;
            color: #8b6f47;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .choice-card:hover .choice-name {
            color: #d4af37;
        }

        .choice-date {
            font-size: 18px;
            color: #d4af37;
            margin-bottom: 25px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .choice-description {
            font-size: 16px;
            color: #888;
            font-style: italic;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .choice-card:hover .choice-description {
            color: #666;
        }

        .view-btn {
            display: inline-block;
            background: linear-gradient(135deg, #d4af37 0%, #f1c40f 100%);
            color: white;
            padding: 14px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        .view-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.5);
            background: linear-gradient(135deg, #f1c40f 0%, #d4af37 100%);
        }

        /* Floating hearts animation */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        .floating-heart {
            position: absolute;
            font-size: 30px;
            opacity: 0.6;
            animation: floatUpRomantic 6s ease-in infinite;
        }

        @keyframes floatUpRomantic {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0.8;
            }
            50% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-title {
                font-size: 48px;
            }

            .subtitle {
                font-size: 18px;
            }

            .choices-grid {
                gap: 30px;
                grid-template-columns: 1fr;
            }

            .card-frame {
                padding: 40px 30px;
                min-height: 350px;
            }

            .choice-icon {
                font-size: 60px;
            }

            .choice-name {
                font-size: 42px;
            }

            .choice-date {
                font-size: 16px;
            }

            .view-btn {
                padding: 12px 30px;
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            .header {
                margin-bottom: 50px;
            }

            .main-title {
                font-size: 40px;
            }

            .subtitle {
                font-size: 16px;
            }

            .choice-icon {
                font-size: 50px;
            }

            .choice-name {
                font-size: 36px;
            }
        }

        /* Gradient text effect */
        .gradient-text {
            background: linear-gradient(135deg, #8b6f47 0%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <!-- Floating Hearts -->
    <div class="floating-hearts" id="floatingHearts"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1 class="main-title">Chào Mừng Bạn</h1>
            <p class="subtitle">Vui lòng chọn lịch tiệc cưới</p>
            <div class="divider"></div>
        </div>

        <!-- Choices Grid -->
        <div class="choices-grid">
            <!-- Groom - April Wedding -->
            <a href="wedding-april.html" class="choice-card">
                <div class="card-frame">
                    <img src="images/SHO05680.JPG" alt="Chú Rể" class="choice-icon">
                    <h2 class="choice-name">Chú Rể</h2>
                    <div class="choice-date">05 • 04 • 2026</div>
                    <p class="choice-description">Tiệc cưới của Chú Rể</p>
                    <button class="view-btn">Xem Thiệp Mời</button>
                </div>
            </a>

            <!-- Bride - March Wedding -->
            <a href="wedding-march.html" class="choice-card">
                <div class="card-frame">
                    <img src="images/SHO06700.JPG" alt="Cô Dâu" class="choice-icon">
                    <h2 class="choice-name">Cô Dâu</h2>
                    <div class="choice-date">22 • 03 • 2026</div>
                    <p class="choice-description">Tiệc cưới của Cô Dâu</p>
                    <button class="view-btn">Xem Thiệp Mời</button>
                </div>
            </a>
        </div>
    </div>

    <script>
        // Generate floating hearts
        function createFloatingHearts() {
            const heartsContainer = document.getElementById('floatingHearts');
            const heartCount = 15;

            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = '♥';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.color = Math.random() > 0.5 ? '#d4af37' : '#f1c40f';
                heart.style.animationDelay = Math.random() * 6 + 's';
                heart.style.fontSize = (Math.random() * 20 + 20) + 'px';

                heartsContainer.appendChild(heart);
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function () {
            createFloatingHearts();

            // Add smooth hover effects
            document.querySelectorAll('.choice-card').forEach(card => {
                card.addEventListener('mouseenter', function () {
                    this.style.transform = 'translateY(-20px)';
                });
                card.addEventListener('mouseleave', function () {
                    this.style.transform = 'translateY(0)';
                });
            });
        });

        // Smooth scroll for any anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth'
                    });
                }
            });
        });
    </script>
</body>
</html>
